# fly.toml app configuration file generated for mangiamundo on 2026-11-16T20:02:20Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'mangiamundo'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Closed places are reported to OpenStreetMap as notes. Unset locally.
  OSM_NOTES_URL = 'https://api.openstreetmap.org/api/0.6/notes'
  # Google sign-in: public OAuth client ids. Android signs in with the web one.
  GOOGLE_WEB_CLIENT_ID = '1020416480252-1hdk15p45gq4le5an455c87ouup4fekm.apps.googleusercontent.com'
  GOOGLE_IOS_CLIENT_ID = '1020416480252-8pd1vmo6081rvfg1emdgltfh7imsipct.apps.googleusercontent.com'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
