name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo test --locked
      # The tests rewrite contract/*.json, which the Android and iOS tests decode.
      - name: Contract fixtures are up to date
        run: |
          git status --porcelain -- ../contract
          test -z "$(git status --porcelain -- ../contract)" || { echo "Run cargo test in backend/ and commit contract/."; exit 1; }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # src/lib/api-types.ts is generated from contract/openapi.json.
      - name: API types are up to date
        run: |
          npm run api-types
          test -z "$(git status --porcelain -- src/lib/api-types.ts)" || { echo "Run npm run api-types in web/ and commit src/lib/api-types.ts."; exit 1; }
      - run: npm run check
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships the Android SDK, so the app module compiles too.
      - run: ./gradlew :core:test :app:compileDebugKotlin
