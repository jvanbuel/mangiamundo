name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # The same checks as the prek hooks in .pre-commit-config.yaml.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The tests rewrite contract/*.json, which the Android and iOS tests decode.
      - name: Contract fixtures are up to date
        run: |
          git status --porcelain -- ../contract
          test -z "$(git status --porcelain -- ../contract)" || { echo "Run cargo test in backend/ and commit contract/."; exit 1; }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # src/lib/api-types.ts is generated from contract/openapi.json.
      - name: API types are up to date
        run: |
          npm run api-types
          test -z "$(git status --porcelain -- src/lib/api-types.ts)" || { echo "Run npm run api-types in web/ and commit src/lib/api-types.ts."; exit 1; }
      - run: npm run check
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships the Android SDK, so the app module compiles too.
      - run: ./gradlew :core:test :app:compileDebugKotlin
      # Renders the screens on the JVM and compares them with the images in
      # app/src/test/snapshots. After a change to the UI: ./gradlew :app:recordPaparazziDebug
      - run: ./gradlew :app:verifyPaparazziDebug
      - name: Keep the images that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-failures
          path: mobile/android/app/build/paparazzi/failures
          if-no-files-found: ignore

  # Deploys main to Fly once the tests above have passed (docs/deploy.md).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One deploy at a time; a deploy that has started is left to finish.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Without the secret there is nothing to deploy with, and that is not a failure.
      # A run that waited for an earlier deploy may no longer be the newest commit: the
      # newer one is deployed by its own run, and an older image must not replace it.
      - name: Is there something to deploy?
        id: check
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::No FLY_API_TOKEN secret, so nothing is deployed (docs/deploy.md)."
            exit 0
          fi
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $tip by now; that commit is deployed by its own run."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.deploy == 'true'
      # .git is not in the image, so the commit shown in the apps is passed in.
      - name: Deploy
        if: steps.check.outputs.deploy == 'true'
        run: flyctl deploy --remote-only --build-arg GIT_COMMIT=${{ steps.check.outputs.commit }}
