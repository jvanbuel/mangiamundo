name: Android release

# Builds the signed app bundle to upload to Google Play. Started by hand: Actions →
# Android release → Run workflow. The bundle is then under the run's artifacts; nothing
# is sent to Play. See docs/release.md.
#
# Repository secrets it needs (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    the upload keystore: base64 -w0 upload.jks
#   ANDROID_KEYSTORE_PASSWORD  the keystore's password
#   ANDROID_KEY_ALIAS          the alias of the upload key in it
#   ANDROID_KEY_PASSWORD       that key's password
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    env:
      MANGIAMUNDO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MANGIAMUNDO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      MANGIAMUNDO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Play takes each version code once; the run number rises with every run.
      MANGIAMUNDO_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing secrets are set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=""
          test -n "$ANDROID_KEYSTORE_BASE64" || missing="$missing ANDROID_KEYSTORE_BASE64"
          test -n "$MANGIAMUNDO_KEYSTORE_PASSWORD" || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          test -n "$MANGIAMUNDO_KEY_ALIAS" || missing="$missing ANDROID_KEY_ALIAS"
          test -n "$MANGIAMUNDO_KEY_PASSWORD" || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/release.md."
            exit 1
          fi
          # Outside the checkout, so the commit shown in the app is not marked dirty.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "MANGIAMUNDO_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :app:bundleRelease
      # An unsigned bundle builds just as well, and Play would only refuse it at upload.
      - name: The bundle is signed
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt" || { echo "::error::The bundle is not signed."; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: mangiamundo-${{ github.run_number }}-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
