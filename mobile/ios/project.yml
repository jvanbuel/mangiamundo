# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: Mangiamundo
options:
  bundleIdPrefix: app.mangiamundo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mangiamundo:
    type: application
    platform: iOS
    sources:
      - Mangiamundo
      # The country outlines are shared with the Android app.
      - path: ../shared/world.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mangiamundo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3L3LXDY2VY
        # Real devices use the deployed backend. The simulator shares the Mac's localhost.
        API_BASE_URL: https://mangiamundo.fly.dev
        "API_BASE_URL[sdk=iphonesimulator*]": http://localhost:8080
    # Push notifications (news of new food) through APNs. Automatic signing turns
    # "development" into "production" when an archive is exported for the App Store.
    entitlements:
      path: Mangiamundo/Mangiamundo.entitlements
      properties:
        aps-environment: development
    # Writes the commit into the built Info.plist, to tell old builds apart in the app.
    postBuildScripts:
      - name: Stamp git commit
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          commit=$(git -C "$SRCROOT" describe --always --dirty 2>/dev/null || echo unknown)
          /usr/libexec/PlistBuddy -c "Set :GitCommit $commit" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    info:
      path: Mangiamundo/Info.plist
      properties:
        CFBundleDisplayName: Mangiamundo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Replaced by the "Stamp git commit" build phase.
        GitCommit: unknown
        # Whole globe on the theme background; StartupLoaderView then takes the bites.
        UILaunchScreen:
          UIImageName: LaunchGlobe
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Nunito, shipped in Mangiamundo/Fonts (SIL Open Font License).
        UIAppFonts:
          - Nunito-Regular.ttf
          - Nunito-Medium.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
          - Nunito-Black.ttf
        # Lets the app check which maps apps are installed (canOpenURL): Google Maps for
        # Directions, CoMaps and Organic Maps for editing a place.
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - cm
          - om
        NSLocationWhenInUseUsageDescription: Mangiamundo uses your location to find restaurants from around the world near you.
        # Where the app finds the backend: see API_BASE_URL above.
        APIBaseURL: $(API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  MangiamundoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MangiamundoTests
    dependencies:
      - target: Mangiamundo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mangiamundo:
    build:
      targets:
        Mangiamundo: all
    test:
      targets:
        - MangiamundoTests
